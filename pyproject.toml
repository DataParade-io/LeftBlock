[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leftblock"
version = "0.9.0"
description = "LeftBlock: a pluggable inspection gate for Git commits"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "PyYAML",
    "behave",
]

[project.optional-dependencies]
# Opt-in model-based `leftblock deep-scan` (downloads about 2.8 GB of weights on first use).
deep = [
    "transformers",
    "torch",
]

[tool.setuptools]
packages = ["leftblock"]

[tool.setuptools.package-data]
leftblock = ["data/*.toml"]

[project.scripts]
leftblock = "leftblock.cli:main"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
tag_format = "v{version}"
# scripts/release_prepare.py keeps the README pin on NEW_VERSION and drops
# commit trailers from the generated changelog; both files are committed.
build_command = """
python scripts/release_prepare.py
python -m pip install build
python -m build
"""
assets = ["README.md", "CHANGELOG.md"]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
